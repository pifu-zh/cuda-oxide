[package]
name = "barrier_smoke"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# [PORT gfx1030 Stage3-1] Minimal shared-memory + sync_threads smoke for the
# AMDGPU path: barrier0 -> llvm.amdgcn.s.barrier, LDS globals, and the
# ntid_x kernarg append, exercised end-to-end on gfx1030.
# Run with:
#   CUDA_OXIDE_TARGET=gfx1030 cargo oxide run barrier_smoke

[dependencies]
# Device-side intrinsics (thread indexing, barriers, etc.)
cuda-device = { path = "../../../cuda-device" }

# Host-side utilities (CudaKernel trait, etc.)
cuda-host = { path = "../../../cuda-host" }

# Host-side CUDA runtime
cuda-core = "0.3.1"

# [PORT gfx1030 Stage2] HIP-backed cuda-bindings stand-in; see
# ../../../host-hip/cuda-bindings/README.md.
[patch.crates-io]
cuda-bindings = { path = "../../../../host-hip/cuda-bindings" }
