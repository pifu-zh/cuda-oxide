[package]
name = "async_vecadd"
version = "0.1.0"
edition = "2024"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# This example demonstrates the async CUDA launch path with DeviceOperation.
# Build with:
#   cargo oxide run async_vecadd

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host", features = ["async"] }
cuda-core = "0.3.1"
cuda-async = "0.3.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

# [PORT gfx1030] auto-injected by cargo-oxide (ensure_hip_patch)
# Swaps the crates.io cuda-bindings (dlopen libcuda, build-time CUDA
# SDK headers) for the HIP-backed stand-in; see
# host-hip/cuda-bindings/README.md.
[patch.crates-io]
cuda-bindings = { path = "../../../../host-hip/cuda-bindings" }
